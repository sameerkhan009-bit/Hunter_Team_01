<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter Team - Professional SMS Manager</title>
    <style>
        :root {
            --bg-body: #0a1118;
            --bg-card: #111d27;
            --bg-subcard: #0c1620;
            --text-main: #ffffff;
            --text-muted: #8492a6;
            --accent-green: #22c55e;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --border-color: #1a2a38;
        }

        .light-mode {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-subcard: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 10px 12px 75px;
            overflow-x: hidden;
            position: relative;
        }

        /* Top Header */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
        }

        .brand-logo {
            font-size: 19px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .brand-logo span {
            color: var(--accent-green);
        }

        .creator-badge {
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .page-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 900;
        }

        .btn-refresh {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Views */
        .tab-view {
            display: none;
            animation: fadeIn 0.2s ease-in;
        }

        .tab-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Today's SMS Banner */
        .live-sms-banner {
            background: linear-gradient(135deg, #103444 0%, #0c2734 100%);
            border: 1px solid #14495f;
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            position: relative;
        }

        .banner-label {
            font-size: 10px;
            font-weight: 800;
            color: #67e8f9;
            text-transform: uppercase;
        }

        .banner-count {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
            margin: 2px 0;
        }

        .banner-sub {
            font-size: 11px;
            color: #a5f3fc;
        }

        .live-tag {
            background: #08202c;
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Ranges Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
        }

        .section-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .active-pill {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Range Card Item */
        .range-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .range-card:active {
            transform: scale(0.98);
        }

        .range-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .range-name {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avail-badge {
            background: #064e3b;
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .range-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .open-link {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        /* Range Details View (Numbers List) */
        .details-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .btn-ctrl {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .range-detail-title {
            font-size: 15px;
            font-weight: 800;
        }

        /* Digit Selector */
        .digit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .digit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .digit-title {
            font-size: 12px;
            font-weight: 700;
        }

        .digit-btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-digit {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-subcard);
            color: var(--text-main);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-digit.active {
            background: var(--accent-green);
            color: #ffffff;
            border-color: var(--accent-green);
        }

        .digit-preview {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Number Row */
        .num-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .num-val {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .num-new {
            background: #b45309;
            color: #fef3c7;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .num-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-limit {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 7px;
            border-radius: 6px;
        }

        .btn-copy-action {
            background: #1a2a38;
            border: 1px solid #2a4054;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            min-width: 65px;
        }

        /* Copied Red State */
        .num-row.copied {
            background: rgba(220, 38, 38, 0.18);
            border-color: #dc2626;
        }

        .num-row.copied .num-val {
            color: #f87171;
        }

        .num-row.copied .btn-copy-action {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
        }

        /* INBOX VIEW */
        .triplet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 16px;
        }

        .stat-cube {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
        }

        .stat-cube .title {
            font-size: 9px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .stat-cube .val {
            font-size: 18px;
            font-weight: 900;
            color: #f87171;
            margin: 2px 0;
        }

        .stat-cube .sub {
            font-size: 9px;
            color: var(--text-muted);
        }

        .msg-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-top {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 800;
        }

        .msg-route {
            font-size: 11px;
            color: var(--text-muted);
        }

        .otp-badge {
            background: linear-gradient(135deg, #065f46, #047857);
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(4, 120, 87, 0.3);
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ALLOCATE VIEW */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-subcard);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            outline: none;
            margin-bottom: 12px;
        }

        .btn-alloc {
            width: 100%;
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        /* LEADERBOARD VIEW */
        .podium-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 6px;
            align-items: end;
            margin-bottom: 16px;
        }

        .podium-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
        }

        .podium-box.first {
            border-color: #eab308;
            background: linear-gradient(180deg, rgba(234, 179, 8, 0.12), var(--bg-card));
        }

        .pod-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #0284c7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            margin: 0 auto 4px;
        }

        .pod-name { font-size: 10px; font-weight: 800; }
        .pod-score { font-size: 17px; font-weight: 900; color: var(--accent-green); }

        .leader-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .leader-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leader-rank {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 58px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 1000;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
        }

        .nav-btn.active {
            color: var(--accent-cyan);
        }

        .nav-btn .nav-icon {
            font-size: 17px;
        }

        .nav-badge {
            position: absolute;
            top: 5px;
            right: 22%;
            background: #0284c7;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 10px;
        }

        /* Sidebar Drawer */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100%;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            z-index: 9999;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 17px;
            font-weight: 900;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            background: var(--bg-subcard);
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .sidebar-link.whatsapp {
            background: #065f46;
            color: #ffffff;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid #334155;
            z-index: 99999;
            display: none;
        }
    </style>
</head>

    <!-- Top Navbar -->
    <div class="top-navbar">

    </div>

    <!-- TAB 1: RANGES VIEW -->
    <div class="tab-view active" id="tab-ranges">
        <!-- Live Today's SMS Banner -->
        <div class="live-sms-banner">
            <div>
                <div class="banner-label">TODAY'S SMS</div>
                <div class="banner-count" id="todaySms">957</div>
                <div class="banner-sub">Live • updated just now</div>
            </div>
            <div class="live-tag">● LIVE</div>

        <div class="section-header">
            <div>
                <div class="section-title">Number Ranges</div>
