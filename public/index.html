<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter Team - Professional SMS Manager</title>
    <style>
        :root {
            --bg-main: #0b131e;
            --bg-card: #132235;
            --bg-subcard: #0e1a29;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-blue: #0284c7;
            --accent-red: #ef4444;
            --border-color: #1e3650;
        }

        .light-mode {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --bg-subcard: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 75px;
            overflow-x: hidden;
            transition: background 0.2s, color 0.2s;
        }

        /* Top Header */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 6px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo span {
            color: var(--accent-green);
        }

        .creator-tag {
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 12px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 900;
        }

        .btn-refresh {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Views */
        .view-content {
            display: none;
            padding: 0 16px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .view-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Today's SMS Banner */
        .live-sms-banner {
            background: linear-gradient(135deg, #164e63, #0f3b4c);
            border: 1px solid #155e75;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .banner-info .lbl {
            font-size: 11px;
            font-weight: 700;
            color: #67e8f9;
            text-transform: uppercase;
        }

        .banner-info .big-count {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
            margin: 4px 0;
        }

        .banner-info .sub {
            font-size: 11px;
            color: #a5f3fc;
        }

        .live-badge {
            background: #083344;
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            position: absolute;
            top: 14px;
            right: 14px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
        }

        .active-pill {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Range Cards */
        .range-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .range-card:active {
            transform: scale(0.98);
        }

        .range-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .range-name {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avail-badge {
            background: #064e3b;
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .range-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .open-link {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Number List View (Inside Range) */
        .country-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .btn-back, .btn-reset {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .country-pill-title {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Country Code Cut Selector */
        .digit-selector-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .digit-sel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .digit-sel-title {
            font-size: 12px;
            font-weight: 700;
        }

        .digit-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-digit {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-subcard);
            color: var(--text-main);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-digit.active {
            background: var(--accent-green);
            color: #ffffff;
            border-color: var(--accent-green);
        }

        .digit-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Number Row Card */
        .number-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .num-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-text {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .new-badge {
            background: #b45309;
            color: #fef3c7;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .num-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .limit-badge {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-copy {
            background: #1e3650;
            border: 1px solid #335377;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            min-width: 65px;
        }

        /* Copied State (Red) */
        .number-row.copied {
            background: rgba(220, 38, 38, 0.15);
            border-color: #dc2626;
        }

        .number-row.copied .num-text {
            color: #f87171;
        }

        .number-row.copied .btn-copy {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
        }

        /* INBOX VIEW */
        .stats-triplet {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-cube {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .stat-cube .title {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-cube .val {
            font-size: 20px;
            font-weight: 900;
            color: #f87171;
            margin: 4px 0;
        }

        .stat-cube .period {
            font-size: 10px;
            color: var(--text-muted);
        }

        .msg-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-phone {
            font-size: 14px;
            font-weight: 800;
        }

        .msg-route {
            font-size: 11px;
            color: var(--text-muted);
        }

        .otp-pill {
            background: linear-gradient(135deg, #065f46, #047857);
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 16px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.3);
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ALLOCATE NUMBER VIEW */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .step-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-box {
            width: 100%;
            background: var(--bg-subcard);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            outline: none;
            margin-bottom: 12px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        /* LEADERBOARD VIEW */
        .podium-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 8px;
            align-items: end;
            margin-bottom: 18px;
        }

        .podium-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
        }

        .podium-card.first {
            border-color: #eab308;
            background: linear-gradient(180deg, rgba(234, 179, 8, 0.1), var(--bg-card));
        }

        .rank-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0284c7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            margin: 0 auto 6px;
        }

        .rank-name {
            font-size: 11px;
            font-weight: 800;
        }

        .rank-score {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-green);
            margin-top: 4px;
        }

        .leader-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .leader-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .leader-rank {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: var(--accent-cyan);
        }

        .nav-item .icon {
            font-size: 18px;
        }

        .nav-badge {
            position: absolute;
            top: 6px;
            right: 22%;
            background: #0284c7;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 10px;
        }

        /* Sidebar Drawer */
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 270px;
            height: 100%;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            z-index: 9999;
            transition: left 0.25s ease;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sidebar-drawer.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 900;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            background: var(--bg-subcard);
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .sidebar-item.whatsapp {
            background: #065f46;
            color: #ffffff;
        }

        /* Toast Notification */
        .toast-box {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid #334155;
            z-index: 99999;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Drawer -->
    <div class="sidebar-drawer" id="sidebarDrawer">
        <div class="sidebar-header">
            <div>Hunter <span>Team</span></div>
            <div style="cursor:pointer;" onclick="toggleSidebar()">✕</div>
        </div>
        <a href="https://panel.lamix.org" target="_blank" class="sidebar-item">
            🔗 CLI Tool (Lamix Search)
        </a>
        <div class="sidebar-item" style="cursor:pointer;" onclick="switchTab('add'); toggleSidebar();">
            ➕ Allocate Number
        </div>
        <a href="https://wa.me/923125868835" target="_blank" class="sidebar-item whatsapp">
            💬 WhatsApp Support: 03125868835
        </a>
    </div>

    <!-- Top Navbar -->
    <div class="top-navbar">
        <div class="brand-group">
            <button class="btn-icon" onclick="toggleSidebar()">☰</button>
            <div class="brand-logo">Hunter <span>Team</span></div>
        </div>
        <button class="btn-icon" onclick="toggleTheme()" id="themeIcon">☀️</button>
    </div>

    <div class="creator-tag">✨ CREATED BY SAMEER KHAN ✨</div>

    <div class="page-title-row">
        <div class="page-title" id="pageTitle">Numbers</div>
        <button class="btn-refresh" onclick="refreshData()">↻ Refresh</button>
    </div>

    <!-- 1. RANGES VIEW -->
    <div class="view-content active" id="view-ranges">
        <!-- Live Counter -->
        <div class="live-sms-banner">
            <div class="banner-info">
                <div class="lbl">TODAY'S SMS</div>
                <div class="big-count" id="todaySmsCount">957</div>
                <div class="sub">Live • updated just now<
